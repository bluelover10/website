server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — keep /site/:slug working on refresh
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache index.html, cache hashed assets
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
